[project]
name = "processing"
version = "0.1.0"
description = "Mulberry document processing engine and canonical data models"
readme = "README.md"
authors = [
    { name = "jaison", email = "jaisondz9360@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
processing = "processing.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

