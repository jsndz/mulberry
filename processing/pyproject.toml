[project]
name = "processing"
version = "0.1.0"
description = "Mulberry document processing engine and canonical data models"
readme = "README.md"
authors = [
    { name = "jaison", email = "jaisondz9360@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "rawpy>=0.18.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "pillow>=9.0.0",
    "accelerate>=0.26.0",
    "pypdfium2>=4.30.0",
    "reportlab>=5.1.0",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.184",
    "rapidocr-onnxruntime>=1.4.4",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
processing = "processing.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"processing" = "src"
